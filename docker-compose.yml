# Личный ассистент: модульная схема.
#
#   telegram ──┐                      ┌── TickTick, ИИ (Claude/Gemini), Groq (голос)
#   (позже:    ├──► core (ядро, API) ─┤
#   алиса, веб,│         │            └── n8n (события и сценарии)
#   sms, ...) ─┘         ▼
#                    db (PostgreSQL) ──► backup (ежедневные копии)
#
# Запуск:     docker compose up -d --build
# Логи:       docker compose logs -f core telegram
# Остановка:  docker compose down        (данные сохраняются)

name: assistant

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
      TZ: ${TZ:-Asia/Irkutsk}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [internal]

  core:
    <<: *common
    build: ./core
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "127.0.0.1:8100:8000"      # доступно только с самого сервера
    mem_limit: 300m
    networks:
      internal:
      shared:
        aliases: [assistant-core]   # так ядро видят n8n и Caddy: http://assistant-core:8000

  telegram:
    <<: *common
    build: ./adapters/telegram
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Заполните TELEGRAM_BOT_TOKEN в .env}
      CORE_API_KEY: ${CORE_API_KEY}
      CORE_URL: http://core:8000
      TZ: ${TZ:-Asia/Irkutsk}
    depends_on:
      core: { condition: service_healthy }
    mem_limit: 200m
    networks: [internal]

  backup:
    <<: *common
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: ${TZ:-Asia/Irkutsk}
    volumes:
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 128m
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
  # Общая сеть с n8n и Caddy. Создаётся один раз: docker network create assistant_shared
  shared:
    name: assistant_shared
    external: true
