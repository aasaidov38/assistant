<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<script>/* тема и анимации из настроек панели (⚙️ Настройки) — до отрисовки */
try { const u = JSON.parse(localStorage.getItem('ui') || '{}');
  if (u.theme === 'light' || u.theme === 'dark') document.documentElement.dataset.theme = u.theme;
  if (u.animations === false) document.documentElement.classList.add('noanim'); } catch (e) {}</script>
<script>if (/[?&]embed\b/.test(location.search) && window.parent !== window) document.documentElement.classList.add('embed');</script>
<title>Ассистент · чат</title>
<link rel="manifest" href="/web/manifest.webmanifest">
<meta name="theme-color" content="#3b82f6">
<link rel="icon" type="image/png" sizes="192x192" href="/web/static/icon-192.png">
<link rel="apple-touch-icon" href="/web/static/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ассистент">
<style>
:root{color-scheme:light;
  --bg:#f3f4f8;--card:#fff;--fg:#0f172a;--muted:#64748b;--line:#e5e7ee;--chip:#e9ecf4;
  --accent:#2a78d6;--me:linear-gradient(135deg,#2a78d6 0%,#6250d6 100%);--bot:#fff;--danger:#d03b3b;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#0d0f14;--card:#171a21;--fg:#eef1f6;--muted:#97a0b0;--line:#262b35;--chip:#1d212a;
  --accent:#3987e5;--me:linear-gradient(135deg,#3987e5 0%,#9085e9 100%);--bot:#171a21;--danger:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0d0f14;--card:#171a21;--fg:#eef1f6;--muted:#97a0b0;--line:#262b35;--chip:#1d212a;
  --accent:#3987e5;--me:linear-gradient(135deg,#3987e5 0%,#9085e9 100%);--bot:#171a21;--danger:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 12px;
  padding-top:max(10px,env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
header a,header button{color:var(--accent);text-decoration:none;background:none;border:0;font:inherit;padding:6px 8px;border-radius:10px;cursor:pointer}
header a:active,header button:active{background:var(--chip)}
.title{flex:1;min-width:0}
.title b{display:block;font-size:16px}
.title small{color:var(--muted);font-size:12px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--me);display:grid;place-items:center;color:#fff;font-size:17px;flex:0 0 auto}
main{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:86%;padding:9px 12px;border-radius:18px;box-shadow:var(--shadow);white-space:pre-wrap;word-wrap:break-word;
  animation:pop .22s ease-out both}
.msg.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:none;box-shadow:none;color:var(--muted);font-size:13px;text-align:center;max-width:95%}
.msg a{color:inherit}
.msg.bot a{color:var(--accent)}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:color-mix(in srgb,var(--fg) 8%,transparent);padding:1px 4px;border-radius:5px}
.msg pre{margin:6px 0;white-space:pre-wrap}
.msg blockquote{margin:4px 0;padding-left:8px;border-left:3px solid var(--accent)}
.msg img.att{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:-2px -4px 6px;object-fit:cover}
.msg .file{display:inline-flex;gap:6px;align-items:center;opacity:.95}
.btns{display:flex;flex-direction:column;gap:6px;margin-top:8px;white-space:normal}
.btns .row{display:flex;gap:6px;flex-wrap:wrap}
.btns button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:12px;
  padding:7px 10px;font:inherit;font-size:14px;cursor:pointer;transition:transform .08s}
.btns button:active{transform:scale(.97)}
.btns button[disabled]{opacity:.5}
.typing{align-self:flex-start;background:var(--bot);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.pending{display:none;align-items:center;gap:10px;margin:6px 12px 0;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.pending.on{display:flex}
.pending img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.pending .ic{width:44px;height:44px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:20px}
.pending .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pending .nm small{display:block;color:var(--muted);font-size:12px}
.pending button{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
footer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.inp{flex:1;display:flex;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:2px 4px 2px 6px;box-shadow:var(--shadow)}
textarea{flex:1;border:0;outline:0;background:none;color:var(--fg);font:inherit;resize:none;max-height:140px;padding:9px 4px;min-height:40px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:20px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.ib:active{background:var(--chip)}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--me);color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);flex:0 0 auto;transition:transform .1s}
.send:active{transform:scale(.94)}
.send[disabled]{opacity:.55}
.rec{display:none;flex:1;align-items:center;gap:10px;padding:0 10px;height:46px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.rec.on{display:flex}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
.rec .t{flex:0 0 auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec button{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:6px}
.rec .hint{flex:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec.cancel .hint{color:var(--danger)}.rec.locked .hint{display:none}.rec:not(.locked) #reccancel{display:none}
.send{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.send.stop{background:var(--danger);box-shadow:0 4px 14px rgba(229,72,77,.35)}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:320px;padding:20px}
.empty .big{font-size:42px;margin-bottom:6px}
main,.chips,footer{width:100%;max-width:780px;margin-left:auto;margin-right:auto}
.pending{margin:6px auto 0;width:calc(100% - 24px);max-width:756px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}main{scroll-behavior:auto}}
.noanim *{animation:none!important;transition:none!important}.noanim main{scroll-behavior:auto}
/* ---------- 1.8.1: строка ввода внизу панели (страница встроена в /web/) ---------- */
.grip{display:none}
.embed body{background:var(--bg)}
.embed header .back{display:none}
.embed header .shut{display:inline-block}
header .shut{display:none;font-size:18px}
.embed:not(.open) header,.embed:not(.open) main,.embed:not(.open) .chips{display:none}
.embed:not(.open) .grip{display:flex}
.embed .grip{justify-content:center;align-items:center;gap:6px;width:100%;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;
  padding:5px 0 0;cursor:pointer;line-height:1}
.embed .grip i{width:36px;height:4px;border-radius:2px;background:var(--line)}
.embed .grip b{font-weight:500}.embed .grip.new b{color:var(--accent)}
.embed .grip.new i{background:var(--accent)}.embed .grip.new b::after{content:" · новый ответ"}
.embed header{touch-action:none;cursor:grab;position:relative;padding-top:14px}
.embed header::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.embed footer{padding-top:6px}
.embed.open main{scroll-behavior:auto}
</style>
</head>
<body>
<header>
  <a class="back" href="/web/" aria-label="К панели">← Панель</a>
  <div class="avatar">✦</div>
  <div class="title"><b>Ассистент</b><small id="sub">пишите как боту в Telegram</small></div>
  <button id="clear" title="Очистить переписку на этом устройстве">🧹</button>
  <button class="shut" id="shut" title="Свернуть" aria-label="Свернуть переписку">⌄</button>
</header>

<main id="list"></main>

<div class="chips" id="chips">
  <button data-t="/today">📊 Сегодня</button>
  <button data-t="/month">💰 Месяц</button>
  <button data-t="/tasks">✅ Задачи</button>
  <button data-t="/undo">↩️ Отменить последнее</button>
  <button data-t="/help">❓ Помощь</button>
</div>

<button class="grip" id="grip" aria-label="Открыть переписку"><i></i><b id="gripT">переписка</b></button>

<div class="pending" id="pending">
  <div id="pthumb"></div>
  <div class="nm"><span id="pname"></span><small id="psize"></small></div>
  <button id="pdrop" aria-label="Убрать файл">✕</button>
</div>

<footer>
  <div class="inp" id="inp">
    <button class="ib" id="attach" title="Фото или файл">📎</button>
    <textarea id="text" rows="1" placeholder="Сообщение…"></textarea>
  </div>
  <div class="rec" id="rec"><span class="dot"></span><span class="t" id="rect">0:00</span><span class="hint">‹ влево — отмена · ↑ закрепить</span><button id="reccancel">Отмена</button></div>
  <button class="send" id="send" aria-label="Отправить">➤</button>
  <input type="file" id="file" accept="image/*,application/pdf,.pdf,.csv,text/csv" hidden>
</footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
const list = $('#list'), text = $('#text'), sendBtn = $('#send');
const APP = !!(window.Android && window.Android.isApp && (() => { try { return Android.isApp(); } catch (e) { return false; } })());
const KEY = 'chat-history-v1', MAX = 15 * 1024 * 1024;
// ---------- 1.8.1: встраивание в панель (строка ввода внизу любого раздела) ----------
// Панель держит эту страницу в рамке /web/chat?embed=1. Свёрнуто — видна только строка ввода,
// развёрнуто — переписка снизу на 80% экрана. Панель и страница обмениваются сообщениями postMessage.
const EMB = (() => {
  const on = document.documentElement.classList.contains('embed');
  const tell = (type, data) => { if (on) try { parent.postMessage({src: 'chat', type, ...(data || {})}, location.origin); } catch (e) {} };
  const isOpen = () => document.documentElement.classList.contains('open');
  function set(open, quiet) {
    if (!on || open === isOpen()) return;
    document.documentElement.classList.toggle('open', open);
    if (open) { document.getElementById('grip').classList.remove('new'); requestAnimationFrame(() => { const l = document.getElementById('list'); l.scrollTop = l.scrollHeight; }); }
    if (!quiet) tell(open ? 'open' : 'close');
    size();
  }
  function size() {   // высота строки ввода в свёрнутом виде — панели, чтобы подогнать рамку
    if (!on) return;
    const h = ['grip', 'pending', 'chips'].reduce((a, id) => { const e = document.getElementById(id); return a + (e && e.offsetParent ? e.offsetHeight : 0); }, 0)
      + (document.querySelector('footer') || {offsetHeight: 0}).offsetHeight;
    tell('size', {h: Math.ceil(h)});
  }
  if (on) {
    addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || e.data.src !== 'panel') return;
      if (e.data.type === 'open') set(true, true);
      if (e.data.type === 'close') set(false, true);
      if (e.data.type === 'focus') document.getElementById('text').focus();
    });
    addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
    addEventListener('DOMContentLoaded', () => {
      const ro = new ResizeObserver(size);
      ['footer', '#pending', '#grip'].forEach(q => { const e = document.querySelector(q); e && ro.observe(e); });
      document.getElementById('grip').onclick = () => set(true);
      document.getElementById('shut').onclick = () => set(false);
      // смахнуть шапку переписки вниз — свернуть
      const hd = document.querySelector('header'); let y0 = null;
      hd.addEventListener('pointerdown', e => { if (e.target.closest('button,a')) return; y0 = e.clientY; try { hd.setPointerCapture(e.pointerId); } catch (_) {} });
      hd.addEventListener('pointermove', e => { if (y0 != null && e.clientY - y0 > 50) { y0 = null; set(false); } });
      hd.addEventListener('pointerup', e => { if (y0 != null && Math.abs(e.clientY - y0) < 6) set(false); y0 = null; });
      size(); tell('ready');
    });
  }
  return {on, tell, size, open: () => set(true), close: () => set(false),
          notice: () => { if (on && !isOpen()) document.getElementById('grip').classList.add('new'); }};
})();
let history = [], pending = null, busy = false, recording = false, recTimer = null, recStart = 0;

// ---------- безопасный показ HTML из ядра (как в Telegram: b, i, u, s, code, pre, a, blockquote) ----------
const OK_TAGS = new Set(['B','STRONG','I','EM','U','INS','S','STRIKE','DEL','CODE','PRE','A','BLOCKQUOTE','BR','SPAN','TG-SPOILER']);
function clean(html) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 1) {
        if (!OK_TAGS.has(ch.tagName)) { walk(ch); ch.replaceWith(...ch.childNodes); return; }
        [...ch.attributes].forEach(a => { if (!(ch.tagName === 'A' && a.name === 'href')) ch.removeAttribute(a.name); });
        if (ch.tagName === 'A') {
          const h = ch.getAttribute('href') || '';
          if (!/^https?:\/\//i.test(h)) ch.removeAttribute('href'); else ch.setAttribute('data-ext', '1');
        }
        walk(ch);
      } else if (ch.nodeType !== 3) ch.remove();
    });
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- история на устройстве ----------
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(history.slice(-80).map(m => ({...m, img: undefined})))); } catch (e) {}
}
function load() {
  try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { history = []; }
}

// ---------- отрисовка ----------
function bubble(m) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.from;
  el.dataset.id = m.id;
  fill(el, m);
  return el;
}
function fill(el, m) {
  let h = '';
  if (m.img) h += `<img class="att" src="${m.img}" alt="">`;
  else if (m.att) h += `<span class="file">${m.att.kind === 'photo' ? '📷' : m.att.kind === 'voice' ? '🎙' : '📄'} ${esc(m.att.name || '')}</span>${m.text || m.html ? '\n' : ''}`;
  h += m.html != null ? clean(m.html) : esc(m.text || '');
  el.innerHTML = h;
  if (m.buttons && m.buttons.length) {
    const box = document.createElement('div'); box.className = 'btns';
    m.buttons.forEach(row => {
      const r = document.createElement('div'); r.className = 'row';
      row.forEach(b => {
        const btn = document.createElement('button');
        btn.textContent = b.text;
        btn.onclick = () => press(m, b, btn);
        r.appendChild(btn);
      });
      box.appendChild(r);
    });
    el.appendChild(box);
  }
}
function render() {
  list.innerHTML = '';
  if (!history.length) {
    list.innerHTML = `<div class="empty"><div class="big">✦</div>Здесь всё как в боте: <b>«Пятёрочка 1450 продукты»</b>, фото чека или тарелки, `
      + `голосовое${APP ? '' : ' (в приложении)'}, выписка PDF/CSV, «завтра в 10 позвонить в банк».</div>`;
  }
  history.forEach(m => list.appendChild(bubble(m)));
  scrollDown();
}
function add(m) {
  m.id = m.id || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  if (!history.length) list.innerHTML = '';
  history.push(m); list.appendChild(bubble(m)); save(); scrollDown();
  if (m.from !== 'me') EMB.notice();
  return m;
}
function scrollDown() { requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; }); }
let typingEl = null;
function typing(on) {
  if (on && !typingEl) { typingEl = document.createElement('div'); typingEl.className = 'typing'; typingEl.innerHTML = '<i></i><i></i><i></i>'; list.appendChild(typingEl); scrollDown(); }
  if (!on && typingEl) { typingEl.remove(); typingEl = null; }
}

// ---------- обмен с ядром ----------
async function api(path, body) {
  const r = await fetch('/web/api/chat/' + path, {
    method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', 'X-Requested-With': 'panel'},
    body: JSON.stringify(body)
  });
  if (r.status === 401 || r.status === 403) throw new Error('auth');
  if (!r.ok) {
    let d = ''; try { d = (await r.json()).detail; } catch (e) {}
    throw new Error(typeof d === 'string' && d ? d : 'Ошибка ' + r.status);
  }
  return r.json();
}
function fail(e) {
  if (e.message === 'auth') add({from: 'sys', text: '🔒 Вход закончился. Напишите боту /web и откройте ссылку — потом вернитесь сюда.'});
  else if (e.message === 'Failed to fetch' || e.name === 'TypeError') add({from: 'sys', text: '📡 Нет связи с сервером. Сообщение не отправлено.'});
  else add({from: 'sys', text: '⚠️ ' + e.message});
}
function setBusy(b) { busy = b; sendBtn.disabled = b && !recording; typing(b); }

async function send(body, mine) {
  if (busy) return;
  EMB.open();
  add(mine);
  setBusy(true);
  try {
    const r = await api('send', body);
    add({from: 'bot', html: r.text, buttons: r.buttons});
    EMB.tell('reply');
  } catch (e) { fail(e); }
  setBusy(false);
}

async function press(m, b, btn) {
  if (b.url) {
    if (EMB.on && b.url.startsWith(location.origin)) EMB.tell('nav', {url: b.url});
    else if (APP && !b.url.startsWith(location.origin)) Android.openExternal(b.url); else location.href = b.url;
    return;
  }
  if (!b.action || busy) return;
  btn.disabled = true;
  setBusy(true);
  try {
    const r = await api('action', {action: b.action});
    if (r.new_message) add({from: 'bot', html: r.text, buttons: r.buttons});
    else {          // как в Telegram: ответ заменяет исходное сообщение
      m.html = r.text; m.buttons = r.buttons; delete m.text;
      const el = list.querySelector(`[data-id="${m.id}"]`); if (el) fill(el, m);
      save();
    }
    EMB.tell('reply');
  } catch (e) { fail(e); btn.disabled = false; }
  setBusy(false);
}

function submit() {
  if (recording) { stopVoice(true); return; }
  const t = text.value.trim();
  if (pending) {
    const p = pending; clearPending();
    text.value = ''; grow();
    send({text: t, file_b64: p.b64, mime: p.mime, name: p.name},
         {from: 'me', text: t, att: {kind: p.kind, name: p.name}, img: p.kind === 'photo' ? `data:${p.mime};base64,${p.b64}` : undefined});
    return;
  }
  if (!t) { text.focus(); return; }
  text.value = ''; grow();
  send({text: t}, {from: 'me', text: t});
}

// ---------- вложения ----------
function kindOf(mime) { return /^image\//.test(mime) ? 'photo' : /^audio\//.test(mime) ? 'voice' : 'file'; }
function setPending(p) {
  if (p.size > MAX) { add({from: 'sys', text: '⚠️ Файл больше 15 МБ — так много ассистент не принимает.'}); return; }
  pending = {...p, kind: kindOf(p.mime)};
  $('#pthumb').innerHTML = pending.kind === 'photo' ? `<img src="data:${p.mime};base64,${p.b64}" alt="">` : '<div class="ic">📄</div>';
  $('#pname').textContent = p.name || 'файл';
  $('#psize').textContent = (pending.kind === 'photo' ? 'Можно добавить подпись: «200 г», «половина»…  ' : '') + Math.max(1, Math.round(p.size / 1024)) + ' КБ';
  $('#pending').classList.add('on');
  updateSend(); text.focus();
}
function clearPending() { pending = null; $('#pending').classList.remove('on'); updateSend(); }
$('#pdrop').onclick = clearPending;
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.size > MAX) { setPending({size: f.size}); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const s = String(rd.result); const b64 = s.slice(s.indexOf(',') + 1);
    setPending({b64, mime: f.type || guess(f.name), name: f.name, size: f.size});
  };
  rd.readAsDataURL(f);
};
function guess(n) { n = (n || '').toLowerCase(); return n.endsWith('.pdf') ? 'application/pdf' : n.endsWith('.csv') ? 'text/csv' : 'application/octet-stream'; }

// «Поделиться → Ассистент» из других приложений
window.onShared = function () {
  if (!APP || !Android.takeShared) return;
  let s = ''; try { s = Android.takeShared(); } catch (e) {}
  if (!s) return;
  let o; try { o = JSON.parse(s); } catch (e) { return; }
  if (o.error) add({from: 'sys', text: '⚠️ ' + o.error});
  if (o.b64) setPending({b64: o.b64, mime: o.mime, name: o.name, size: Math.round(o.b64.length * 3 / 4)});
  if (o.text) { text.value = o.text; grow(); }
  updateSend();
};

// ---------- голос: удерживайте 🎙, как в Telegram ----------
// В приложении пишет Android (ogg), в браузере — MediaRecorder (webm / ogg / mp4 у Safari).
const WEBREC = !APP && !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const VOICE = APP || WEBREC;
let hold = null, locked = false, skipClick = false, mr = null, chunks = [], stream = null;
const holdHint = () => add({from: 'sys', text: '🎙 Удерживайте кнопку, пока говорите, и отпустите — сообщение уйдёт. Сдвиг влево — отмена, вверх — запись без рук.'});
const MIN_MS = 500, CANCEL_DX = 90, LOCK_DY = 70;
function recMime() {
  for (const t of ['audio/ogg;codecs=opus', 'audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'])
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  return '';
}
const extOf = m => /ogg/.test(m) ? 'ogg' : /mp4|aac|m4a/.test(m) ? 'm4a' : /mpeg|mp3/.test(m) ? 'mp3' : /wav/.test(m) ? 'wav' : 'webm';
async function startVoice() {
  if (!VOICE || busy || recording) return;
  if (APP) { Android.voiceStart(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
  } catch (e) {
    hold = null;
    add({from: 'sys', text: '🎙 Браузер не дал доступ к микрофону. Разрешите его в настройках сайта (значок замка у адреса) и попробуйте снова.'});
    return;
  }
  if (!hold && !locked) { stream.getTracks().forEach(t => t.stop()); stream = null;   // отпустили, пока браузер спрашивал
    holdHint(); return; }
  const mime = recMime(); chunks = [];
  try { mr = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); add({from: 'sys', text: '🎙 Этот браузер не умеет записывать звук.'}); return; }
  mr.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  mr.onstop = () => {
    stream && stream.getTracks().forEach(t => t.stop()); stream = null;
    const keep = mr._send, type = (mr.mimeType || mime || 'audio/webm').split(';')[0]; mr = null;
    if (!keep || !chunks.length) return;
    const blob = new Blob(chunks, {type});
    if (blob.size > MAX) { add({from: 'sys', text: '⚠️ Слишком длинное голосовое.'}); return; }
    const rd = new FileReader();
    rd.onload = () => { const s = String(rd.result); window.onVoice(s.slice(s.indexOf(',') + 1), type); };
    rd.readAsDataURL(blob);
  };
  mr.start(250);
  window.onVoiceStarted();
}
window.onVoiceStarted = () => {
  recording = true; recStart = Date.now();
  $('#inp').style.display = 'none'; $('#rec').classList.add('on'); $('#rec').classList.toggle('locked', locked);
  sendBtn.classList.add('stop'); sendBtn.textContent = locked ? '➤' : '🎙'; sendBtn.disabled = false;
  if (!hold && !locked) { stopVoice(false); return; }     // отпустили раньше, чем запись началась
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('#rect').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s >= 300) stopVoice(true);
  }, 250);
};
function stopVoice(sendIt) {
  if (!recording) return;
  if (sendIt && Date.now() - recStart < MIN_MS) sendIt = false;
  recording = false; locked = false; hold = null; clearInterval(recTimer);
  $('#rec').classList.remove('on', 'locked', 'cancel'); $('#inp').style.display = ''; $('#rect').textContent = '0:00';
  sendBtn.classList.remove('stop'); sendBtn.style.transform = ''; updateSend();
  if (APP) Android.voiceStop(!!sendIt);
  else if (mr) { mr._send = !!sendIt; try { mr.stop(); } catch (e) {} }
}
// жесты на кнопке: держать — запись, отпустить — отправить, влево — отмена, вверх — закрепить
const micMode = () => VOICE && !text.value.trim() && !pending && !busy;
sendBtn.addEventListener('pointerdown', e => {
  if (recording || !micMode() || e.button > 0) return;
  e.preventDefault(); skipClick = true;
  try { sendBtn.setPointerCapture(e.pointerId); } catch (_) {}
  hold = {x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId};
  if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
  startVoice();
});
sendBtn.addEventListener('pointermove', e => {
  if (!hold || e.pointerId !== hold.id || locked) return;
  const dx = Math.min(0, e.clientX - hold.x), dy = Math.min(0, e.clientY - hold.y);
  sendBtn.style.transform = `translate(${Math.max(dx, -CANCEL_DX)}px, ${Math.max(dy, -LOCK_DY)}px)`;
  $('#rec').classList.toggle('cancel', dx < -CANCEL_DX * .6);
  if (dx < -CANCEL_DX) { stopVoice(false); hold = null; return; }
  if (dy < -LOCK_DY) { locked = true; hold = null; sendBtn.style.transform = '';
    $('#rec').classList.add('locked'); sendBtn.textContent = '➤';
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {} }
});
function release(e, cancel) {
  if (!hold || (e && e.pointerId !== hold.id)) return;
  const short = Date.now() - hold.t < MIN_MS; hold = null; sendBtn.style.transform = '';
  if (locked) return;
  if (!recording) return;                                  // запись ещё не началась — onVoiceStarted сам отменит
  if (cancel || short) { stopVoice(false);
    if (short && !cancel) holdHint();
    return; }
  stopVoice(true);
}
sendBtn.addEventListener('pointerup', e => release(e, false));
sendBtn.addEventListener('pointercancel', e => release(e, true));
sendBtn.addEventListener('contextmenu', e => { if (hold || recording) e.preventDefault(); });
$('#reccancel').onclick = () => stopVoice(false);
window.onVoice = (b64, mime) => {
  mime = mime || 'audio/ogg';
  send({file_b64: b64, mime, name: 'voice.' + extOf(mime), voice: true}, {from: 'me', text: '', att: {kind: 'voice', name: 'голосовое'}});
};
window.onVoiceError = msg => { hold = null; locked = false; add({from: 'sys', text: '🎙 ' + msg}); };
window.onVoicePermission = ok => add({from: 'sys', text: ok ? '🎙 Доступ к микрофону есть. Удерживайте кнопку и говорите.'
  : '🎙 Без доступа к микрофону голосовые не работают. Разрешить можно в настройках телефона: Приложения → Ассистент → Разрешения.'});

// ---------- поле ввода ----------
function grow() { text.style.height = 'auto'; text.style.height = Math.min(text.scrollHeight, 140) + 'px'; updateSend(); }
function updateSend() {
  if (recording) return;
  const empty = !text.value.trim() && !pending;
  sendBtn.textContent = empty && VOICE ? '🎙' : '➤';
  sendBtn.setAttribute('aria-label', empty && VOICE ? 'Удерживайте, чтобы записать голосовое' : 'Отправить');
  sendBtn.disabled = busy || (empty && !VOICE);
}
text.addEventListener('input', grow);
text.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); submit(); }
});
sendBtn.onclick = () => { if (skipClick) { skipClick = false; if (locked && recording) return; if (!recording) return; } submit(); };
sendBtn.addEventListener('pointerdown', () => { if (!micMode()) skipClick = false; }, true);
$('#chips').onclick = e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  send({text: b.dataset.t}, {from: 'me', text: b.textContent});
};
$('#clear').onclick = () => {
  if (!confirmClear()) return;
  history = []; save(); render();
};
function confirmClear() {      // без системных диалогов (в приложении они мешают)
  const b = $('#clear');
  if (b.dataset.armed) { delete b.dataset.armed; b.textContent = '🧹'; return true; }
  b.dataset.armed = '1'; b.textContent = 'Очистить?';
  setTimeout(() => { delete b.dataset.armed; b.textContent = '🧹'; }, 3000);
  return false;
}
list.addEventListener('click', e => {      // ссылки из ответов — во внешнем браузере
  const a = e.target.closest('a[data-ext]'); if (!a) return;
  e.preventDefault();
  if (APP) Android.openExternal(a.href); else window.open(a.href, '_blank', 'noopener');
});

if (!VOICE) $('#sub').textContent = 'голосовые — в приложении';
if (!APP && 'serviceWorker' in navigator) navigator.serviceWorker.register('/web/sw.js', {scope: '/web/'}).catch(() => {});
load(); render(); updateSend();
window.onShared();
</script>
</body>
</html>
